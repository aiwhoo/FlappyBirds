<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <script src="https://unpkg.com/kontra@10.0.2/kontra.js"></script>
    </head>
    <body>
        <canvas id="gameid" width="600" height="600"></canvas>
        <script>
            function overlaps(l1,r1,l2,r2){
                return r1 > l2 && l1 < r2
            }
            let { init, initKeys, Sprite, GameLoop, keyPressed } = kontra

            let { canvas } = init();
            initKeys();
            let player = Sprite({
                x: 0,
                y: 0,
                width: 40,
                height: 30,
                color: 'blue',
                update: function () {
                    console.log("update triggered");
                    if(keyPressed("arrowright")){
                        console.log("rightarrow");
                        this.x += 2;
                    }
                    if (keyPressed("arrowleft")){
                        console.log("leftarrow");
                        this.x -= 2;
                    }
                    if (keyPressed("arrowup")){
                        console.log("uparrow");
                        this.y -=2;
                    }
                    if (keyPressed("arrowdown")){
                        console.log("downarrow");
                        this.y +=2;
                    }
                }
            });

            let enemy = Sprite({
                x: 500,
                y: 100,
                width: 40,
                height: 30,
                color: 'red',
                update: function () {
                    this.x -= 2;
                }
            })
            let game = GameLoop({
                update: function() { // update the game state
                    player.update();
                    enemy.update();
                    if (overlaps (player.x,player.x+player.width,enemy.x,enemy.x+enemy.width) &&
                        overlaps (player.y,player.y+player.height,enemy.y,enemy.y+enemy.height)
                    ) {
                        player.color = "black"
                    }

                },
                render: function() { // render the game state
                    player.render();
                    enemy.render();
                }
            });
            game.start();

        </script>
    </body>
</html>
